<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="The system map, stacked for the phone: the extension, then each of the four other parts with what passes on its edge." font-family="var(--font-mono, 'JetBrains Mono', ui-monospace, monospace)">
<rect width="600" height="600" fill="var(--surface, #1a2520)"/>
<rect x="48" y="48" width="504" height="96" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="64" y="72" font-size="11" fill="var(--brass, #e0ae62)" letter-spacing="1.2">BUYER EXTENSION</text>
<text x="64" y="96" font-size="12" fill="var(--muted, #a89f90)">Inside the page. Paints the rules, records the</text>
<text x="64" y="112" font-size="12" fill="var(--muted, #a89f90)">journey, surfaces the code. Touches all four</text>
<text x="64" y="128" font-size="12" fill="var(--muted, #a89f90)">others.</text>
<text x="48" y="170" font-size="10" fill="var(--lit, #f3c77e)">what passes on each edge</text>
<rect x="48" y="188" width="504" height="80" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="64" y="212" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">PRICING PORTAL</text>
<text x="64" y="236" font-size="12" fill="var(--muted, #a89f90)">rules for one event, on each poll · the token,</text>
<text x="64" y="252" font-size="12" fill="var(--muted, #a89f90)">borrowed from the open tab</text>
<rect x="48" y="280" width="504" height="80" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="64" y="304" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">TICKETMASTER PAGES</text>
<text x="64" y="328" font-size="12" fill="var(--muted, #a89f90)">seat IDs, the cart, the confirmation read ·</text>
<text x="64" y="344" font-size="12" fill="var(--muted, #a89f90)">rings, fill, note, the stop painted</text>
<rect x="48" y="372" width="504" height="96" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="64" y="396" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">THE APPROVAL DESK</text>
<text x="64" y="420" font-size="12" fill="var(--muted, #a89f90)">rows that match a rule · how close the event</text>
<text x="64" y="436" font-size="12" fill="var(--muted, #a89f90)">is to its maximum · the bonus button, posted</text>
<text x="64" y="452" font-size="12" fill="var(--muted, #a89f90)">to Slack</text>
<rect x="48" y="480" width="504" height="80" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="64" y="504" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">THE CODE RELAY</text>
<text x="64" y="528" font-size="12" fill="var(--muted, #a89f90)">a code is requested · the code returns to</text>
<text x="64" y="544" font-size="12" fill="var(--muted, #a89f90)">screen and clipboard</text>
</svg>
