<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="The rule’s path in seven steps: the map appears, the content script asks, the worker fetches with the borrowed token, the poll runs every fifteen seconds while the tab is visible, the rules are handed into the page world, seat IDs are read from React internals, the seats are painted." font-family="var(--font-mono, 'JetBrains Mono', ui-monospace, monospace)">
<rect width="1200" height="310" fill="var(--surface, #1a2520)"/>
<text x="48" y="40" font-size="10" fill="var(--lit, #f3c77e)">the rule’s path, in seven steps</text>
<text x="48" y="78" font-size="10" fill="var(--lit, #f3c77e)">01</text>
<rect x="48" y="86" width="148" height="150" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="60" y="110" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">MAP APPEARS</text>
<text x="60" y="124" font-size="10" fill="var(--dim-numeral, #4a5a50)">isolated world</text>
<text x="60" y="148" font-size="10" fill="var(--muted, #a89f90)">A MutationObserver</text>
<text x="60" y="163" font-size="10" fill="var(--muted, #a89f90)">waits for the</text>
<text x="60" y="178" font-size="10" fill="var(--muted, #a89f90)">section layer, then</text>
<text x="60" y="193" font-size="10" fill="var(--muted, #a89f90)">disconnects.</text>
<line x1="196" y1="160" x2="208" y2="160" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
<text x="208" y="78" font-size="10" fill="var(--lit, #f3c77e)">02</text>
<rect x="208" y="86" width="148" height="150" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="220" y="110" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">CONTENT SCRIPT ASKS</text>
<text x="220" y="124" font-size="10" fill="var(--dim-numeral, #4a5a50)">isolated world</text>
<text x="220" y="148" font-size="10" fill="var(--muted, #a89f90)">One message to the</text>
<text x="220" y="163" font-size="10" fill="var(--muted, #a89f90)">worker with the</text>
<text x="220" y="178" font-size="10" fill="var(--muted, #a89f90)">event ID.</text>
<line x1="356" y1="160" x2="368" y2="160" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
<text x="368" y="78" font-size="10" fill="var(--lit, #f3c77e)">03</text>
<rect x="368" y="86" width="148" height="150" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="380" y="110" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">WORKER FETCHES</text>
<text x="380" y="124" font-size="10" fill="var(--dim-numeral, #4a5a50)">extension</text>
<text x="380" y="148" font-size="10" fill="var(--muted, #a89f90)">With the token</text>
<text x="380" y="163" font-size="10" fill="var(--muted, #a89f90)">borrowed from the</text>
<text x="380" y="178" font-size="10" fill="var(--muted, #a89f90)">open portal tab.</text>
<line x1="516" y1="160" x2="528" y2="160" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
<text x="528" y="78" font-size="10" fill="var(--lit, #f3c77e)">04</text>
<rect x="528" y="86" width="148" height="150" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="540" y="110" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">POLL WHILE VISIBLE</text>
<text x="540" y="124" font-size="10" fill="var(--dim-numeral, #4a5a50)">isolated world</text>
<text x="540" y="148" font-size="10" fill="var(--muted, #a89f90)">Every 15 seconds;</text>
<text x="540" y="163" font-size="10" fill="var(--muted, #a89f90)">paused when the tab</text>
<text x="540" y="178" font-size="10" fill="var(--muted, #a89f90)">is hidden.</text>
<line x1="676" y1="160" x2="688" y2="160" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
<text x="688" y="78" font-size="10" fill="var(--lit, #f3c77e)">05</text>
<rect x="688" y="86" width="148" height="150" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="700" y="110" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">HANDOFF</text>
<text x="700" y="124" font-size="10" fill="var(--dim-numeral, #4a5a50)">page world</text>
<text x="700" y="148" font-size="10" fill="var(--muted, #a89f90)">Rules posted across</text>
<text x="700" y="163" font-size="10" fill="var(--muted, #a89f90)">the world boundary.</text>
<line x1="836" y1="160" x2="848" y2="160" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="848" y="78" font-size="10" fill="var(--lit, #f3c77e)">06</text>
<rect x="848" y="86" width="148" height="150" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="860" y="110" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">SEAT IDS READ</text>
<text x="860" y="124" font-size="10" fill="var(--dim-numeral, #4a5a50)">page world</text>
<text x="860" y="148" font-size="10" fill="var(--muted, #a89f90)">From the React</text>
<text x="860" y="163" font-size="10" fill="var(--muted, #a89f90)">internals on each</text>
<text x="860" y="178" font-size="10" fill="var(--muted, #a89f90)">seat element.</text>
<line x1="996" y1="160" x2="1008" y2="160" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="1008" y="78" font-size="10" fill="var(--lit, #f3c77e)">07</text>
<rect x="1008" y="86" width="148" height="150" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="1020" y="110" font-size="10" fill="var(--brass, #e0ae62)" letter-spacing="1">PAINT</text>
<text x="1020" y="124" font-size="10" fill="var(--dim-numeral, #4a5a50)">page world</text>
<text x="1020" y="148" font-size="10" fill="var(--muted, #a89f90)">Rings, section fill,</text>
<text x="1020" y="163" font-size="10" fill="var(--muted, #a89f90)">the note, or the</text>
<text x="1020" y="178" font-size="10" fill="var(--muted, #a89f90)">stop overlay.</text>
<text x="48" y="280" font-size="10" fill="var(--dim-numeral, #4a5a50)">No long-lived ports anywhere: one-shot messages with a reply, and window messages across the world boundary. Brass is the paint, the one step the buyer sees.</text>
</svg>
