<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 908" width="600" height="908" role="img" aria-label="The telemetry funnel, stacked for the phone." font-family="var(--font-mono, 'JetBrains Mono', ui-monospace, monospace)">
<defs>
<marker id="telemetry-funnel-tall-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
</marker>
<marker id="telemetry-funnel-tall-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
</marker>
</defs>
<rect width="600" height="908" fill="var(--surface, #1a2520)"/>
<text x="48" y="36" font-size="10" fill="var(--lit, #f3c77e)">the telemetry funnel, stacked</text>
<rect x="48" y="52" width="504" height="64" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="64" y="76" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">BUYER’S PAGE</text>
<text x="64" y="100" font-size="12" fill="var(--muted, #a89f90)">a cart, an error, a confirmation</text>
<line x1="300" y1="116" x2="300" y2="144" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#telemetry-funnel-tall-a)"/>
<rect x="48" y="144" width="504" height="64" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="64" y="168" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">CONTENT SCRIPT</text>
<text x="64" y="192" font-size="12" fill="var(--muted, #a89f90)">notices it; stamps the browser’s time</text>
<text x="536" y="168" font-size="10" fill="var(--lit, #f3c77e)" text-anchor="end">t1 · browser clock</text>
<line x1="300" y1="208" x2="300" y2="236" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#telemetry-funnel-tall-a)"/>
<rect x="48" y="236" width="504" height="64" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="64" y="260" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">WORKER</text>
<text x="64" y="284" font-size="12" fill="var(--muted, #a89f90)">one record, two destinations</text>
<line x1="300" y1="300" x2="300" y2="328" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#telemetry-funnel-tall-a)"/>
<rect x="48" y="328" width="504" height="80" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="64" y="352" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">WAREHOUSE</text>
<text x="64" y="376" font-size="12" fill="var(--muted, #a89f90)">The system of record; the second destination</text>
<text x="64" y="392" font-size="12" fill="var(--muted, #a89f90)">of the same record.</text>
<line x1="300" y1="408" x2="300" y2="436" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#telemetry-funnel-tall-a)"/>
<rect x="48" y="436" width="504" height="64" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="64" y="460" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">INGESTION</text>
<text x="64" y="484" font-size="12" fill="var(--muted, #a89f90)">stamps the upload time; writes one document</text>
<text x="536" y="460" font-size="10" fill="var(--lit, #f3c77e)" text-anchor="end">t2 · server clock</text>
<line x1="300" y1="500" x2="300" y2="528" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#telemetry-funnel-tall-a)"/>
<rect x="48" y="528" width="504" height="64" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="64" y="552" font-size="11" fill="var(--brass, #e0ae62)" letter-spacing="1.2">FIRESTORE</text>
<text x="64" y="576" font-size="12" fill="var(--muted, #a89f90)">pushes it to every listener</text>
<line x1="300" y1="592" x2="300" y2="620" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#telemetry-funnel-tall-ab)"/>
<rect x="48" y="620" width="504" height="64" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="64" y="644" font-size="11" fill="var(--brass, #e0ae62)" letter-spacing="1.2">LISTENER</text>
<text x="64" y="668" font-size="12" fill="var(--muted, #a89f90)">one tab, one collection, newest first</text>
<line x1="300" y1="684" x2="300" y2="712" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#telemetry-funnel-tall-ab)"/>
<rect x="48" y="712" width="504" height="64" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="64" y="736" font-size="11" fill="var(--brass, #e0ae62)" letter-spacing="1.2">REDUCE</text>
<text x="64" y="760" font-size="12" fill="var(--muted, #a89f90)">latest per buyer, account, event</text>
<line x1="300" y1="776" x2="300" y2="804" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#telemetry-funnel-tall-ab)"/>
<rect x="48" y="804" width="504" height="64" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="64" y="828" font-size="11" fill="var(--brass, #e0ae62)" letter-spacing="1.2">TABLE</text>
<text x="64" y="852" font-size="12" fill="var(--muted, #a89f90)">a row appears; roll-ups recomputed</text>
</svg>
