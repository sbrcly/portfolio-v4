<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" width="600" height="690" role="img" aria-label="Five origins, stacked for the phone." font-family="var(--font-mono, 'JetBrains Mono', ui-monospace, monospace)">
<defs>
<marker id="five-origins-tall-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
</marker>
<marker id="five-origins-tall-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
</marker>
</defs>
<rect width="600" height="690" fill="var(--surface, #1a2520)"/>
<text x="48" y="36" font-size="10" fill="var(--lit, #f3c77e)">five origins, stacked</text>
<rect x="48" y="52" width="504" height="94" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="64" y="76" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">PORTAL PAGE</text>
<text x="64" y="92" font-size="10" fill="var(--dim-numeral, #4a5a50)">portal origin</text>
<text x="64" y="114" font-size="12" fill="var(--muted, #a89f90)">Session token in page storage. Reloaded to</text>
<text x="64" y="130" font-size="12" fill="var(--muted, #a89f90)">refresh the token.</text>
<line x1="300" y1="178" x2="300" y2="146" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#five-origins-tall-a)"/>
<text x="316" y="166" font-size="10" fill="var(--dim-numeral, #4a5a50)">reads the token</text>
<rect x="48" y="178" width="504" height="94" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="64" y="202" font-size="11" fill="var(--brass, #e0ae62)" letter-spacing="1.2">EXTENSION WORKER</text>
<text x="64" y="218" font-size="10" fill="var(--dim-numeral, #4a5a50)">extension origin</text>
<text x="64" y="240" font-size="12" fill="var(--muted, #a89f90)">Routes every message. Borrows the token and</text>
<text x="64" y="256" font-size="12" fill="var(--muted, #a89f90)">fetches the rules. Badge: green or red.</text>
<line x1="300" y1="272" x2="300" y2="304" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#five-origins-tall-ab)"/>
<text x="316" y="292" font-size="10" fill="var(--brass, #e0ae62)">rules, one-shot reply</text>
<rect x="48" y="304" width="504" height="94" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="64" y="328" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">MARKETPLACE · ISOLATED</text>
<text x="64" y="344" font-size="10" fill="var(--dim-numeral, #4a5a50)">marketplace origin</text>
<text x="64" y="366" font-size="12" fill="var(--muted, #a89f90)">Waits for the map; polls every 15 s while</text>
<text x="64" y="382" font-size="12" fill="var(--muted, #a89f90)">visible. Compares, then hands the rules on.</text>
<line x1="300" y1="398" x2="300" y2="430" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#five-origins-tall-ab)"/>
<text x="316" y="418" font-size="10" fill="var(--brass, #e0ae62)">window.postMessage</text>
<rect x="48" y="430" width="504" height="94" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="64" y="454" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">MARKETPLACE · PAGE WORLD</text>
<text x="64" y="470" font-size="10" fill="var(--dim-numeral, #4a5a50)">marketplace origin</text>
<text x="64" y="492" font-size="12" fill="var(--muted, #a89f90)">Reads seat IDs from React internals. Paints</text>
<text x="64" y="508" font-size="12" fill="var(--muted, #a89f90)">rings, fills, notes, the stop sign.</text>
<line x1="300" y1="556" x2="300" y2="524" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#five-origins-tall-a)"/>
<text x="316" y="544" font-size="10" fill="var(--dim-numeral, #4a5a50)">origin-checked message, to the parent page</text>
<rect x="48" y="556" width="504" height="94" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="64" y="580" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">IDENTITY IFRAME</text>
<text x="64" y="596" font-size="10" fill="var(--dim-numeral, #4a5a50)">identity origin</text>
<text x="64" y="618" font-size="12" fill="var(--muted, #a89f90)">Watches the verification screen. Reports to</text>
<text x="64" y="634" font-size="12" fill="var(--muted, #a89f90)">the parent by message.</text>
</svg>
