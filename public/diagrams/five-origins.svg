<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Five origins: the portal page, the extension worker, the marketplace isolated world, the marketplace page world, and the identity iframe, with the rule travelling from the worker through the isolated world into the page world." font-family="var(--font-mono, 'JetBrains Mono', ui-monospace, monospace)">
<defs>
<marker id="five-origins-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
</marker>
<marker id="five-origins-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
</marker>
</defs>
<rect width="1200" height="560" fill="var(--surface, #1a2520)"/>
<rect x="48" y="72" width="208" height="280" fill="var(--ground, #0e1512)" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="64" y="102" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.3">PORTAL PAGE</text>
<text x="64" y="142" font-size="11" fill="var(--dim-numeral, #4a5a50)">portal origin</text>
<text x="64" y="176" font-size="12" fill="var(--muted, #a89f90)">Session token in page</text>
<text x="64" y="193" font-size="12" fill="var(--muted, #a89f90)">storage.</text>
<text x="64" y="222" font-size="12" fill="var(--muted, #a89f90)">Reloaded to refresh the</text>
<text x="64" y="239" font-size="12" fill="var(--muted, #a89f90)">token.</text>
<rect x="284" y="72" width="208" height="280" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="300" y="102" font-size="11" fill="var(--brass, #e0ae62)" letter-spacing="1.3">EXTENSION WORKER</text>
<text x="300" y="142" font-size="11" fill="var(--dim-numeral, #4a5a50)">extension origin</text>
<text x="300" y="176" font-size="12" fill="var(--muted, #a89f90)">Routes every message.</text>
<text x="300" y="205" font-size="12" fill="var(--muted, #a89f90)">Borrows the token and</text>
<text x="300" y="222" font-size="12" fill="var(--muted, #a89f90)">fetches the rules.</text>
<text x="300" y="251" font-size="12" fill="var(--muted, #a89f90)">Badge: green or red.</text>
<rect x="520" y="72" width="208" height="280" fill="var(--ground, #0e1512)" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="536" y="102" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.3">MARKETPLACE · ISOLATED</text>
<text x="536" y="118" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.3">WORLD</text>
<text x="536" y="142" font-size="11" fill="var(--dim-numeral, #4a5a50)">marketplace origin</text>
<text x="536" y="176" font-size="12" fill="var(--muted, #a89f90)">Waits for the map; polls</text>
<text x="536" y="193" font-size="12" fill="var(--muted, #a89f90)">every 15 s while</text>
<text x="536" y="210" font-size="12" fill="var(--muted, #a89f90)">visible.</text>
<text x="536" y="239" font-size="12" fill="var(--muted, #a89f90)">Compares, then hands the</text>
<text x="536" y="256" font-size="12" fill="var(--muted, #a89f90)">rules on.</text>
<rect x="756" y="72" width="208" height="280" fill="var(--ground, #0e1512)" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="772" y="102" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.3">MARKETPLACE · PAGE WORLD</text>
<text x="772" y="142" font-size="11" fill="var(--dim-numeral, #4a5a50)">marketplace origin</text>
<text x="772" y="176" font-size="12" fill="var(--muted, #a89f90)">Reads seat IDs from</text>
<text x="772" y="193" font-size="12" fill="var(--muted, #a89f90)">React internals.</text>
<text x="772" y="222" font-size="12" fill="var(--muted, #a89f90)">Paints rings, fills,</text>
<text x="772" y="239" font-size="12" fill="var(--muted, #a89f90)">notes, the stop sign.</text>
<rect x="992" y="72" width="208" height="280" fill="var(--ground, #0e1512)" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="1008" y="102" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.3">IDENTITY IFRAME</text>
<text x="1008" y="142" font-size="11" fill="var(--dim-numeral, #4a5a50)">identity origin</text>
<text x="1008" y="176" font-size="12" fill="var(--muted, #a89f90)">Watches the verification</text>
<text x="1008" y="193" font-size="12" fill="var(--muted, #a89f90)">screen.</text>
<text x="1008" y="222" font-size="12" fill="var(--muted, #a89f90)">Reports to the parent by</text>
<text x="1008" y="239" font-size="12" fill="var(--muted, #a89f90)">message.</text>
<line x1="388" y1="408" x2="192" y2="408" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#five-origins-a)"/>
<text x="290" y="398" font-size="11" fill="var(--dim-numeral, #4a5a50)" text-anchor="middle">reads the token</text>
<line x1="624" y1="448" x2="418" y2="448" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#five-origins-a)"/>
<text x="521" y="438" font-size="11" fill="var(--dim-numeral, #4a5a50)" text-anchor="middle">asks for the event's rules</text>
<line x1="388" y1="488" x2="594" y2="488" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#five-origins-ab)"/>
<text x="491" y="478" font-size="11" fill="var(--brass, #e0ae62)" text-anchor="middle">rules, one-shot reply</text>
<line x1="624" y1="488" x2="830" y2="488" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#five-origins-ab)"/>
<text x="727" y="478" font-size="11" fill="var(--brass, #e0ae62)" text-anchor="middle">window.postMessage</text>
<line x1="1096" y1="448" x2="890" y2="448" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#five-origins-a)"/>
<text x="993" y="438" font-size="11" fill="var(--dim-numeral, #4a5a50)" text-anchor="middle">origin-checked message</text>
<text x="48" y="532" font-size="11" fill="var(--dim-numeral, #4a5a50)">Brass: the rule. Grey: what has to happen for the rule to move. Dashed boxes are origins the extension does not own.</text>
</svg>
