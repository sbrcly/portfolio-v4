<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-label="Five origins: the portal page, the extension worker, the marketplace isolated world, the marketplace page world, and the identity iframe, with the rule travelling from the worker through the isolated world into the page world." font-family="var(--font-mono, 'JetBrains Mono', ui-monospace, monospace)">
<defs>
<marker id="five-origins-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
</marker>
<marker id="five-origins-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
</marker>
</defs>
<rect width="1200" height="530" fill="var(--surface, #1a2520)"/>
<text x="48" y="40" font-size="10" fill="var(--lit, #f3c77e)">five origins, one rule</text>
<rect x="48" y="60" width="208" height="210" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="60" y="84" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">PORTAL PAGE</text>
<text x="60" y="98" font-size="10" fill="var(--dim-numeral, #4a5a50)">portal origin</text>
<text x="60" y="122" font-size="10" fill="var(--muted, #a89f90)">Session token in page storage.</text>
<text x="60" y="137" font-size="10" fill="var(--muted, #a89f90)">Reloaded to refresh the token.</text>
<rect x="284" y="60" width="208" height="210" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="296" y="84" font-size="10" fill="var(--brass, #e0ae62)" letter-spacing="1">EXTENSION WORKER</text>
<text x="296" y="98" font-size="10" fill="var(--dim-numeral, #4a5a50)">extension origin</text>
<text x="296" y="122" font-size="10" fill="var(--muted, #a89f90)">Routes every message. Borrows</text>
<text x="296" y="137" font-size="10" fill="var(--muted, #a89f90)">the token and fetches the</text>
<text x="296" y="152" font-size="10" fill="var(--muted, #a89f90)">rules. Badge: green or red.</text>
<rect x="520" y="60" width="208" height="210" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="532" y="84" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">MARKETPLACE · ISOLATED</text>
<text x="532" y="98" font-size="10" fill="var(--dim-numeral, #4a5a50)">marketplace origin</text>
<text x="532" y="122" font-size="10" fill="var(--muted, #a89f90)">Waits for the map; polls every</text>
<text x="532" y="137" font-size="10" fill="var(--muted, #a89f90)">15 s while visible. Compares,</text>
<text x="532" y="152" font-size="10" fill="var(--muted, #a89f90)">then hands the rules on.</text>
<rect x="756" y="60" width="208" height="210" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="768" y="84" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">MARKETPLACE · PAGE WORLD</text>
<text x="768" y="98" font-size="10" fill="var(--dim-numeral, #4a5a50)">marketplace origin</text>
<text x="768" y="122" font-size="10" fill="var(--muted, #a89f90)">Reads seat IDs from React</text>
<text x="768" y="137" font-size="10" fill="var(--muted, #a89f90)">internals. Paints rings,</text>
<text x="768" y="152" font-size="10" fill="var(--muted, #a89f90)">fills, notes, the stop sign.</text>
<rect x="992" y="60" width="208" height="210" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1004" y="84" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">IDENTITY IFRAME</text>
<text x="1004" y="98" font-size="10" fill="var(--dim-numeral, #4a5a50)">identity origin</text>
<text x="1004" y="122" font-size="10" fill="var(--muted, #a89f90)">Watches the verification</text>
<text x="1004" y="137" font-size="10" fill="var(--muted, #a89f90)">screen. Reports to the parent</text>
<text x="1004" y="152" font-size="10" fill="var(--muted, #a89f90)">by message.</text>
<line x1="318" y1="320" x2="222" y2="320" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#five-origins-a)"/>
<text x="270" y="312" font-size="10" fill="var(--dim-numeral, #4a5a50)" text-anchor="middle">reads the token</text>
<line x1="554" y1="360" x2="458" y2="360" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#five-origins-a)"/>
<text x="506" y="352" font-size="10" fill="var(--dim-numeral, #4a5a50)" text-anchor="middle">asks for the event’s rules</text>
<line x1="458" y1="400" x2="554" y2="400" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#five-origins-ab)"/>
<text x="506" y="392" font-size="10" fill="var(--brass, #e0ae62)" text-anchor="middle">rules, one-shot reply</text>
<line x1="694" y1="400" x2="790" y2="400" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#five-origins-ab)"/>
<text x="742" y="392" font-size="10" fill="var(--brass, #e0ae62)" text-anchor="middle">window.postMessage</text>
<line x1="1026" y1="440" x2="694" y2="440" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#five-origins-a)"/>
<text x="860" y="432" font-size="10" fill="var(--dim-numeral, #4a5a50)" text-anchor="middle">origin-checked message</text>
<text x="48" y="500" font-size="10" fill="var(--dim-numeral, #4a5a50)">Brass: the rule. Grey: what has to happen for the rule to move. Dashed boxes are origins the extension does not own.</text>
</svg>
