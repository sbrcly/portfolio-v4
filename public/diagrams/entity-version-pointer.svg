<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="The entity, version, pointer model: an entity holds a pointer to its published version; versions accumulate underneath it, each one draft, published, or superseded; a draft is diffed and published by moving the pointer, a rollback publishes an older version, and an edit to a fragment or grounding that many surfaces depend on passes a digest-bound impact review first." font-family="var(--font-mono, 'JetBrains Mono', ui-monospace, monospace)">
<defs>
<marker id="entity-version-pointer-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
</marker>
<marker id="entity-version-pointer-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
</marker>
</defs>
<rect width="1200" height="460" fill="var(--surface, #1a2520)"/>
<rect x="72" y="140" width="220" height="96" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="84" y="164" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">ENTITY</text>
<text x="84" y="188" font-size="10" fill="var(--muted, #a89f90)">one surface, one fragment,</text>
<text x="84" y="203" font-size="10" fill="var(--muted, #a89f90)">one grounding</text>
<text x="84" y="220" font-size="10" fill="var(--brass, #e0ae62)">published -&gt;</text>
<rect x="400" y="92" width="170" height="40" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="412" y="117" font-size="10" fill="var(--muted, #a89f90)">v1 · superseded</text>
<rect x="400" y="144" width="170" height="40" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="412" y="169" font-size="10" fill="var(--muted, #a89f90)">v2 · superseded</text>
<rect x="400" y="196" width="170" height="40" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="412" y="221" font-size="10" fill="var(--brass, #e0ae62)">v3 · published</text>
<rect x="400" y="248" width="170" height="40" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="412" y="273" font-size="10" fill="var(--muted, #a89f90)">v4 · draft</text>
<path d="M292 216 L400 216" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#entity-version-pointer-ab)"/>
<text x="400" y="76" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">VERSIONS, APPEND-ONLY</text>
<text x="400" y="308" font-size="10" fill="var(--muted, #a89f90)">the pointer moves; rows never change</text>
<rect x="660" y="140" width="130" height="72" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="672" y="164" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">DRAFT</text>
<text x="672" y="188" font-size="10" fill="var(--muted, #a89f90)">edited in place</text>
<rect x="830" y="140" width="130" height="72" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="842" y="164" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">IN REVIEW</text>
<text x="842" y="188" font-size="10" fill="var(--muted, #a89f90)">diffed against</text>
<text x="842" y="203" font-size="10" fill="var(--muted, #a89f90)">the published</text>
<rect x="1000" y="140" width="130" height="72" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="1012" y="164" font-size="10" fill="var(--brass, #e0ae62)" letter-spacing="1">PUBLISHED</text>
<text x="1012" y="188" font-size="10" fill="var(--muted, #a89f90)">the pointer</text>
<text x="1012" y="203" font-size="10" fill="var(--muted, #a89f90)">moves here</text>
<line x1="790" y1="176" x2="830" y2="176" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#entity-version-pointer-a)"/>
<line x1="960" y1="176" x2="1000" y2="176" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#entity-version-pointer-ab)"/>
<text x="810" y="168" font-size="10" fill="var(--muted, #a89f90)" text-anchor="middle">review</text>
<text x="980" y="168" font-size="10" fill="var(--brass, #e0ae62)" text-anchor="middle">publish</text>
<path d="M1065 140 C 1065 84 725 84 725 140" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#entity-version-pointer-a)" stroke-dasharray="3 3"/>
<text x="895" y="94" font-size="10" fill="var(--muted, #a89f90)" text-anchor="middle">roll back: publish any older version</text>
<text x="660" y="60" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">DRAFT TO PUBLISH</text>
<rect x="830" y="290" width="300" height="110" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="842" y="314" font-size="10" fill="var(--text, #e4dbcb)" letter-spacing="1">IMPACT REVIEW</text>
<text x="842" y="338" font-size="10" fill="var(--muted, #a89f90)">a fragment or grounding is shared, so one</text>
<text x="842" y="353" font-size="10" fill="var(--muted, #a89f90)">edit rewrites many prompts: the review</text>
<text x="842" y="368" font-size="10" fill="var(--muted, #a89f90)">lists every dependent, before and after,</text>
<text x="842" y="383" font-size="10" fill="var(--muted, #a89f90)">and a digest binds publish to that review</text>
<path d="M895 212 L895 290" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#entity-version-pointer-a)"/>
<path d="M1130 330 L1152 330 L1152 176 L1130 176" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#entity-version-pointer-ab)"/>
<text x="830" y="280" font-size="10" fill="var(--lit, #f3c77e)">when the edit fans out</text>
</svg>
