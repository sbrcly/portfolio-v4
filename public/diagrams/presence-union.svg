<rect x="760" y="104" width="220" height="40" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="772" y="128" font-size="10" fill="var(--muted, #a89f90)">weekly return</text>
