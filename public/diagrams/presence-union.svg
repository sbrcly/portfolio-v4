<path d="M218 106 C 300 106 330 230 380 230" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
<rect x="48" y="132" width="170" height="32" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="60" y="152" font-size="10" fill="var(--muted, #a89f90)">Sunday reading</text>
