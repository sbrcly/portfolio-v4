<text x="772" y="240" font-size="10" fill="var(--muted, #a89f90)">retention by cohort</text>
<path d="M640 230 C 700 230 700 236 760 236" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#presence-union-ab)"/>
<rect x="760" y="272" width="220" height="40" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="772" y="296" font-size="10" fill="var(--muted, #a89f90)">definition-change marker</text>
<path d="M640 230 C 700 230 700 292 760 292" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#presence-union-ab)"/>
<rect x="760" y="328" width="220" height="40" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="772" y="352" font-size="10" fill="var(--muted, #a89f90)">app health</text>
<path d="M640 230 C 700 230 700 348 760 348" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#presence-union-ab)"/>
<text x="760" y="392" font-size="10" fill="var(--muted, #a89f90)">none reads a leg directly</text>
</svg>
