<path d="M218 232 C 300 232 330 230 380 230" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
<rect x="48" y="258" width="170" height="32" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
