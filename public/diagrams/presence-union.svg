<text x="60" y="362" font-size="10" fill="var(--muted, #a89f90)">surface open</text>
<path d="M218 358 C 300 358 330 230 380 230" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
