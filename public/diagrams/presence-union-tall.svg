<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 556" width="600" height="556" role="img" aria-label="The presence union, stacked for the phone." font-family="var(--font-mono, 'JetBrains Mono', ui-monospace, monospace)">
<defs>
<marker id="presence-union-tall-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1"/>
</marker>
<marker id="presence-union-tall-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
</marker>
</defs>
<rect width="600" height="556" fill="var(--surface, #1a2520)"/>
<rect x="48" y="48" width="504" height="88" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="64" y="72" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">EIGHT SOURCES</text>
<text x="64" y="96" font-size="12" fill="var(--muted, #a89f90)">activity log · journal · Sunday reading · weekday reading</text>
<text x="64" y="112" font-size="12" fill="var(--muted, #a89f90)">Bible chapter · verse mark · People · surface open</text>
<line x1="300" y1="136" x2="300" y2="172" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#presence-union-tall-a)"/>
<rect x="48" y="172" width="504" height="72" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="64" y="196" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">TIMEZONE BUCKETING</text>
<text x="64" y="220" font-size="12" fill="var(--muted, #a89f90)">each timestamp becomes a Pacific day first</text>
<line x1="300" y1="244" x2="300" y2="280" stroke="var(--dim-numeral, #4a5a50)" stroke-width="1" marker-end="url(#presence-union-tall-a)"/>
<rect x="48" y="280" width="504" height="72" fill="var(--ground, #0e1512)" stroke="var(--brass, #e0ae62)" stroke-width="1"/>
<text x="64" y="304" font-size="11" fill="var(--brass, #e0ae62)" letter-spacing="1.2">ONE FOLD</text>
<text x="64" y="328" font-size="12" fill="var(--muted, #a89f90)">union by person and Pacific day; present once, however many sources</text>
<line x1="300" y1="352" x2="300" y2="388" stroke="var(--brass, #e0ae62)" stroke-width="1" marker-end="url(#presence-union-tall-ab)"/>
<rect x="48" y="388" width="504" height="120" fill="var(--ground, #0e1512)" stroke="var(--rule, #2e3b34)" stroke-width="1"/>
<text x="64" y="412" font-size="11" fill="var(--text, #e4dbcb)" letter-spacing="1.2">MANY WIDGETS</text>
<text x="64" y="436" font-size="12" fill="var(--muted, #a89f90)">DAU · weekly return · engagement row</text>
<text x="64" y="454" font-size="12" fill="var(--muted, #a89f90)">retention by cohort · definition-change marker</text>
<text x="64" y="472" font-size="12" fill="var(--muted, #a89f90)">app health · none reads a leg directly</text>
</svg>
