<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" width="600" height="690" role="img" aria-label="Five origins, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="690" fill="#1A2520"></rect><text x="48" y="36" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">five origins, stacked</text><rect x="48" y="52" width="504" height="94" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="64" y="76" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">PORTAL PAGE</text><text x="64" y="92" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">portal origin</text><text x="64" y="114" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Session token in page storage. Reloaded to</text><text x="64" y="130" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">refresh the token.</text><line x1="300" y1="178" x2="300" y2="146" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="316" y="166" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">reads the token</text><rect x="48" y="178" width="504" height="94" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="202" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">EXTENSION WORKER</text><text x="64" y="218" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">extension origin</text><text x="64" y="240" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Routes every message. Borrows the token and</text><text x="64" y="256" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">fetches the rules. Badge: green or red.</text><line x1="300" y1="272" x2="300" y2="304" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="316" y="292" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62">rules, one-shot reply</text><rect x="48" y="304" width="504" height="94" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="64" y="328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">MARKETPLACE · ISOLATED</text><text x="64" y="344" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">marketplace origin</text><text x="64" y="366" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Waits for the map; polls every 15 s while</text><text x="64" y="382" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">visible. Compares, then hands the rules on.</text><line x1="300" y1="398" x2="300" y2="430" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="316" y="418" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62">window.postMessage</text><rect x="48" y="430" width="504" height="94" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="64" y="454" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">MARKETPLACE · PAGE WORLD</text><text x="64" y="470" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">marketplace origin</text><text x="64" y="492" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Reads seat IDs from React internals. Paints</text><text x="64" y="508" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">rings, fills, notes, the stop sign.</text><line x1="300" y1="556" x2="300" y2="524" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="316" y="544" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">origin-checked message, to the parent page</text><rect x="48" y="556" width="504" height="94" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="64" y="580" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">IDENTITY IFRAME</text><text x="64" y="596" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">identity origin</text><text x="64" y="618" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Watches the verification screen. Reports to</text><text x="64" y="634" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">the parent by message.</text></svg>