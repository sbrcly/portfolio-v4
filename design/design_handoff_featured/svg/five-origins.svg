<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-label="Five origins: the portal page, the extension worker, the marketplace isolated world, the marketplace page world, and the identity iframe, with the rule travelling from the worker through the isolated world into the page world." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="1200" height="530" fill="#1A2520"></rect><text x="48" y="40" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">five origins, one rule</text><rect x="48" y="60" width="208" height="210" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="60" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">PORTAL PAGE</text><text x="60" y="98" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">portal origin</text><text x="60" y="122" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Session token in page storage.</text><text x="60" y="137" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Reloaded to refresh the token.</text><rect x="284" y="60" width="208" height="210" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="296" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" letter-spacing="1">EXTENSION WORKER</text><text x="296" y="98" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">extension origin</text><text x="296" y="122" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Routes every message. Borrows</text><text x="296" y="137" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the token and fetches the</text><text x="296" y="152" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">rules. Badge: green or red.</text><rect x="520" y="60" width="208" height="210" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="532" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">MARKETPLACE · ISOLATED</text><text x="532" y="98" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">marketplace origin</text><text x="532" y="122" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Waits for the map; polls every</text><text x="532" y="137" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">15 s while visible. Compares,</text><text x="532" y="152" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">then hands the rules on.</text><rect x="756" y="60" width="208" height="210" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="768" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">MARKETPLACE · PAGE WORLD</text><text x="768" y="98" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">marketplace origin</text><text x="768" y="122" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Reads seat IDs from React</text><text x="768" y="137" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">internals. Paints rings,</text><text x="768" y="152" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">fills, notes, the stop sign.</text><rect x="992" y="60" width="208" height="210" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="1004" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">IDENTITY IFRAME</text><text x="1004" y="98" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">identity origin</text><text x="1004" y="122" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Watches the verification</text><text x="1004" y="137" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">screen. Reports to the parent</text><text x="1004" y="152" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">by message.</text><line x1="318" y1="320" x2="222" y2="320" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="270" y="312" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" text-anchor="middle">reads the token</text><line x1="554" y1="360" x2="458" y2="360" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="506" y="352" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" text-anchor="middle">asks for the event’s rules</text><line x1="458" y1="400" x2="554" y2="400" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="506" y="392" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" text-anchor="middle">rules, one-shot reply</text><line x1="694" y1="400" x2="790" y2="400" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="742" y="392" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" text-anchor="middle">window.postMessage</text><line x1="1026" y1="440" x2="694" y2="440" stroke="#4A5A50" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"></line><text x="860" y="432" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" text-anchor="middle">origin-checked message</text><text x="48" y="500" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">Brass: the rule. Grey: what has to happen for the rule to move. Dashed boxes are origins the extension does not own.</text></svg>