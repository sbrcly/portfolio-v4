<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1084" width="600" height="1084" role="img" aria-label="The code relay, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="1084" fill="#1A2520"></rect><text x="48" y="36" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">the code relay, stacked for the phone</text><rect x="48" y="52" width="504" height="80" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="76" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">01 · THE PAGE ASKS</text><text x="64" y="100" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">A code is needed on the page. The content</text><text x="64" y="116" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">script sends one message to the worker.</text><line x1="300" y1="132" x2="300" y2="160" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="160" width="504" height="96" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="184" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">02 · THE WORKER FORWARDS</text><text x="64" y="208" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">To the Express service. The HTTP response is</text><text x="64" y="224" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">held open until the code is there, even while</text><text x="64" y="240" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">queued.</text><line x1="300" y1="256" x2="300" y2="284" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="284" width="504" height="96" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="308" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">03 · CHECK FIRST</text><text x="64" y="332" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">A code for that line from the last fifteen</text><text x="64" y="348" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">minutes is returned at once; no port is</text><text x="64" y="364" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">opened.</text><line x1="300" y1="380" x2="300" y2="408" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="408" width="504" height="96" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="432" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">04 · ELSE OPEN THE PORT</text><text x="64" y="456" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">The scheduler opens the line’s port. One port</text><text x="64" y="472" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">per group is open at a time; other requests in</text><text x="64" y="488" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">the group queue.</text><line x1="300" y1="504" x2="300" y2="532" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="532" width="504" height="80" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="556" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">05 · THE TEXT LANDS</text><text x="64" y="580" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">The gateway’s webhook writes the code to</text><text x="64" y="596" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Firestore, keyed by line.</text><line x1="300" y1="612" x2="300" y2="640" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="640" width="504" height="80" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="664" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">05B · OR THE MAIL HOOK</text><text x="64" y="688" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">One Python run per email upserts the latest</text><text x="64" y="704" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">code per address into Postgres.</text><line x1="300" y1="720" x2="300" y2="748" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="748" width="504" height="64" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="772" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">06 · THE SERVICE POLLS</text><text x="64" y="796" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Every ten seconds, for up to ninety.</text><line x1="300" y1="812" x2="300" y2="840" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="840" width="504" height="96" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="864" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">07 · RETURN AND RELEASE</text><text x="64" y="888" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">The held response returns the code; the port</text><text x="64" y="904" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">is released on every exit, timeout included;</text><text x="64" y="920" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">the next request in the group starts.</text><line x1="300" y1="936" x2="300" y2="964" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="964" width="504" height="80" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="988" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">08 · TO THE PAGE AND THE CLIPBOARD</text><text x="64" y="1012" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">The buyer sees it where they are and can paste</text><text x="64" y="1028" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">it.</text></svg>