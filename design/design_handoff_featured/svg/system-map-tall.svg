<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="The system map, stacked for the phone: the extension, then each of the four other parts with what passes on its edge." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="600" fill="#1A2520"></rect><rect x="48" y="48" width="504" height="96" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="72" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">BUYER EXTENSION</text><text x="64" y="96" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Inside the page. Paints the rules, records the</text><text x="64" y="112" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">journey, surfaces the code. Touches all four</text><text x="64" y="128" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">others.</text><text x="48" y="170" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">what passes on each edge</text><rect x="48" y="188" width="504" height="80" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="212" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">PRICING PORTAL</text><text x="64" y="236" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">rules for one event, on each poll · the token,</text><text x="64" y="252" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">borrowed from the open tab</text><rect x="48" y="280" width="504" height="80" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="64" y="304" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">TICKETMASTER PAGES</text><text x="64" y="328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">seat IDs, the cart, the confirmation read ·</text><text x="64" y="344" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">rings, fill, note, the stop painted</text><rect x="48" y="372" width="504" height="96" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="64" y="396" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">THE APPROVAL DESK</text><text x="64" y="420" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">rows that match a rule · how close the event</text><text x="64" y="436" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">is to its maximum · the bonus button, posted</text><text x="64" y="452" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">to Slack</text><rect x="48" y="480" width="504" height="80" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="504" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">THE CODE RELAY</text><text x="64" y="528" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">a code is requested · the code returns to</text><text x="64" y="544" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">screen and clipboard</text></svg>