<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 870" width="600" height="870" role="img" aria-label="The rule’s path, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="870" fill="#1A2520"></rect><text x="48" y="36" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">the rule’s path, stacked</text><rect x="48" y="52" width="504" height="94" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="76" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">01 · MAP APPEARS</text><text x="64" y="92" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">isolated world</text><text x="64" y="114" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">A MutationObserver waits for the section</text><text x="64" y="130" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">layer, then disconnects.</text><line x1="300" y1="146" x2="300" y2="174" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="174" width="504" height="78" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="198" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">02 · CONTENT SCRIPT ASKS</text><text x="64" y="214" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">isolated world</text><text x="64" y="236" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">One message to the worker with the event ID.</text><line x1="300" y1="252" x2="300" y2="280" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="280" width="504" height="94" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="304" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">03 · WORKER FETCHES</text><text x="64" y="320" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">extension</text><text x="64" y="342" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">With the token borrowed from the open portal</text><text x="64" y="358" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">tab.</text><line x1="300" y1="374" x2="300" y2="402" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="402" width="504" height="94" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="426" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">04 · POLL WHILE VISIBLE</text><text x="64" y="442" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">isolated world</text><text x="64" y="464" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Every 15 seconds; paused when the tab is</text><text x="64" y="480" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">hidden.</text><line x1="300" y1="496" x2="300" y2="524" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="524" width="504" height="78" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="548" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">05 · HANDOFF</text><text x="64" y="564" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">page world</text><text x="64" y="586" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Rules posted across the world boundary.</text><line x1="300" y1="602" x2="300" y2="630" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="630" width="504" height="78" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="654" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">06 · SEAT IDS READ</text><text x="64" y="670" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">page world</text><text x="64" y="692" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">From the React internals on each seat element.</text><line x1="300" y1="708" x2="300" y2="736" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="736" width="504" height="94" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="760" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">07 · PAINT</text><text x="64" y="776" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">page world</text><text x="64" y="798" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Rings, section fill, the note, or the stop</text><text x="64" y="814" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">overlay.</text></svg>