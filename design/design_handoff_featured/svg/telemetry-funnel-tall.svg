<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 908" width="600" height="908" role="img" aria-label="The telemetry funnel, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="908" fill="#1A2520"></rect><text x="48" y="36" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">the telemetry funnel, stacked</text><rect x="48" y="52" width="504" height="64" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="76" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">BUYER’S PAGE</text><text x="64" y="100" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">a cart, an error, a confirmation</text><line x1="300" y1="116" x2="300" y2="144" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="144" width="504" height="64" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="168" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">CONTENT SCRIPT</text><text x="64" y="192" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">notices it; stamps the browser’s time</text><text x="536" y="168" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E" text-anchor="end">t1 · browser clock</text><line x1="300" y1="208" x2="300" y2="236" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="236" width="504" height="64" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="260" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">WORKER</text><text x="64" y="284" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">one record, two destinations</text><line x1="300" y1="300" x2="300" y2="328" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="328" width="504" height="80" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="352" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">WAREHOUSE</text><text x="64" y="376" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">The system of record; the second destination</text><text x="64" y="392" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">of the same record.</text><line x1="300" y1="408" x2="300" y2="436" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="436" width="504" height="64" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="460" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">INGESTION</text><text x="64" y="484" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">stamps the upload time; writes one document</text><text x="536" y="460" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E" text-anchor="end">t2 · server clock</text><line x1="300" y1="500" x2="300" y2="528" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="528" width="504" height="64" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="552" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">FIRESTORE</text><text x="64" y="576" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">pushes it to every listener</text><line x1="300" y1="592" x2="300" y2="620" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="620" width="504" height="64" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="644" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">LISTENER</text><text x="64" y="668" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">one tab, one collection, newest first</text><line x1="300" y1="684" x2="300" y2="712" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="712" width="504" height="64" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="736" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">REDUCE</text><text x="64" y="760" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">latest per buyer, account, event</text><line x1="300" y1="776" x2="300" y2="804" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="804" width="504" height="64" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="828" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">TABLE</text><text x="64" y="852" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">a row appears; roll-ups recomputed</text></svg>