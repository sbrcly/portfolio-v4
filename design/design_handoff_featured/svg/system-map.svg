<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The system map: the buyer extension at the centre; the pricing portal to its left sending rules and lending its token; Ticketmaster pages above, read for seats and the cart and painted with rings, fill, note, and the stop; the approval desk to its right receiving highlighted rows, the per-event maximum, and the bonus button; the code relay below, asked for a code and returning it to screen and clipboard." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="1200" height="620" fill="#1A2520"></rect><text x="60" y="40" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">the system, with the extension at the centre</text><rect x="515" y="70" width="170" height="120" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="527" y="94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">TICKETMASTER PAGES</text><text x="527" y="118" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the event page, the</text><text x="527" y="133" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">map, the cart, the</text><text x="527" y="148" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">confirmation. Not ours.</text><rect x="60" y="250" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="72" y="274" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">PRICING PORTAL</text><text x="72" y="298" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">where managers write</text><text x="72" y="313" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">buy rules, a maximum</text><text x="72" y="328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">per event, and limits</text><text x="72" y="343" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">per account.</text><rect x="515" y="250" width="170" height="130" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="527" y="274" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" letter-spacing="1">BUYER EXTENSION</text><text x="527" y="298" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">inside the page: paints</text><text x="527" y="313" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the rules, records the</text><text x="527" y="328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">journey, surfaces the</text><text x="527" y="343" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">code.</text><rect x="970" y="250" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="982" y="274" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">THE APPROVAL DESK</text><text x="982" y="298" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">where managers approve</text><text x="982" y="313" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">carted tickets. The</text><text x="982" y="328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">extension decorates its</text><text x="982" y="343" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">table.</text><rect x="515" y="450" width="170" height="120" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="527" y="474" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">THE CODE RELAY</text><text x="527" y="498" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">an Express service and</text><text x="527" y="513" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">a Python mail hook</text><text x="527" y="528" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">behind an SMS gateway</text><text x="527" y="543" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">and an inbox.</text><line x1="230" y1="300" x2="513" y2="300" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="372" y="290" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" text-anchor="middle">rules for one event, on each poll</text><line x1="513" y1="340" x2="232" y2="340" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="372" y="358" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" text-anchor="middle">borrows the token from the open tab</text><line x1="565" y1="190" x2="565" y2="248" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="555" y="224" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" text-anchor="end">seat IDs, the cart, the confirmation</text><line x1="635" y1="248" x2="635" y2="192" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="645" y="224" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62">rings, fill, note, the stop</text><line x1="685" y1="300" x2="968" y2="300" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="827" y="290" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" text-anchor="middle">rows that match a rule; the maximum</text><line x1="685" y1="340" x2="968" y2="340" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="827" y="358" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" text-anchor="middle">the bonus button, posted to Slack</text><line x1="565" y1="380" x2="565" y2="448" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="555" y="418" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" text-anchor="end">a code is requested</text><line x1="635" y1="448" x2="635" y2="382" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="645" y="418" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62">the code, to screen and clipboard</text><text x="60" y="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">Brass: what the extension carries. Grey: what it reads. Dashed boxes are pages the extension does not own. Five parts; the extension is the only one that touches the other four.</text></svg>