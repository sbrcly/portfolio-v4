<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="The rule’s path in seven steps: the map appears, the content script asks, the worker fetches with the borrowed token, the poll runs every fifteen seconds while the tab is visible, the rules are handed into the page world, seat IDs are read from React internals, the seats are painted." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="1200" height="310" fill="#1A2520"></rect><text x="48" y="40" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">the rule’s path, in seven steps</text><text x="48" y="78" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">01</text><rect x="48" y="86" width="148" height="150" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="60" y="110" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">MAP APPEARS</text><text x="60" y="124" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">isolated world</text><text x="60" y="148" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">A MutationObserver</text><text x="60" y="163" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">waits for the</text><text x="60" y="178" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">section layer, then</text><text x="60" y="193" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">disconnects.</text><line x1="196" y1="160" x2="208" y2="160" stroke="#4A5A50" stroke-width="1"></line><text x="208" y="78" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">02</text><rect x="208" y="86" width="148" height="150" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="220" y="110" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">CONTENT SCRIPT ASKS</text><text x="220" y="124" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">isolated world</text><text x="220" y="148" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">One message to the</text><text x="220" y="163" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">worker with the</text><text x="220" y="178" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">event ID.</text><line x1="356" y1="160" x2="368" y2="160" stroke="#4A5A50" stroke-width="1"></line><text x="368" y="78" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">03</text><rect x="368" y="86" width="148" height="150" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="380" y="110" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">WORKER FETCHES</text><text x="380" y="124" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">extension</text><text x="380" y="148" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">With the token</text><text x="380" y="163" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">borrowed from the</text><text x="380" y="178" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">open portal tab.</text><line x1="516" y1="160" x2="528" y2="160" stroke="#4A5A50" stroke-width="1"></line><text x="528" y="78" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">04</text><rect x="528" y="86" width="148" height="150" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="540" y="110" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">POLL WHILE VISIBLE</text><text x="540" y="124" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">isolated world</text><text x="540" y="148" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Every 15 seconds;</text><text x="540" y="163" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">paused when the tab</text><text x="540" y="178" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">is hidden.</text><line x1="676" y1="160" x2="688" y2="160" stroke="#4A5A50" stroke-width="1"></line><text x="688" y="78" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">05</text><rect x="688" y="86" width="148" height="150" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="700" y="110" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">HANDOFF</text><text x="700" y="124" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">page world</text><text x="700" y="148" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Rules posted across</text><text x="700" y="163" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the world boundary.</text><line x1="836" y1="160" x2="848" y2="160" stroke="#E0AE62" stroke-width="1"></line><text x="848" y="78" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">06</text><rect x="848" y="86" width="148" height="150" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="860" y="110" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">SEAT IDS READ</text><text x="860" y="124" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">page world</text><text x="860" y="148" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">From the React</text><text x="860" y="163" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">internals on each</text><text x="860" y="178" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">seat element.</text><line x1="996" y1="160" x2="1008" y2="160" stroke="#E0AE62" stroke-width="1"></line><text x="1008" y="78" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">07</text><rect x="1008" y="86" width="148" height="150" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="1020" y="110" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" letter-spacing="1">PAINT</text><text x="1020" y="124" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">page world</text><text x="1020" y="148" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Rings, section fill,</text><text x="1020" y="163" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the note, or the</text><text x="1020" y="178" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">stop overlay.</text><text x="48" y="280" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50">No long-lived ports anywhere: one-shot messages with a reply, and window messages across the world boundary. Brass is the paint, the one step the buyer sees.</text></svg>