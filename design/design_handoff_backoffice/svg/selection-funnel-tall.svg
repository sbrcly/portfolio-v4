<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1048" width="600" height="1048" role="img" aria-label="The selection funnel, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="1048" fill="#1A2520"></rect><rect x="48" y="48" width="504" height="88" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="72" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">ELIGIBILITY</text><text x="64" y="96" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">about 400 acts; approved, in season, for this life</text><text x="64" y="112" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">context</text><line x1="300" y1="136" x2="300" y2="172" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="172" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="196" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">POOL SPLIT</text><text x="64" y="220" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">two pools: the person's own acts and the library's</text><line x1="300" y1="244" x2="300" y2="280" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="280" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="304" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">RECENCY EXCLUSION</text><text x="64" y="328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">what was offered lately is out</text><line x1="300" y1="352" x2="300" y2="388" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="388" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="412" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">HARD GATES</text><text x="64" y="436" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">difficulty, time of day, what the person said no to</text><line x1="300" y1="460" x2="300" y2="496" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="496" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="520" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">WEIGHTED SCORE</text><text x="64" y="544" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">fit to focus area, personality, season</text><line x1="300" y1="568" x2="300" y2="604" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="604" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="628" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">PENALTIES</text><text x="64" y="652" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">repetition; the same category twice</text><line x1="300" y1="676" x2="300" y2="712" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="712" width="504" height="72" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="736" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">85 / 15 PICK</text><text x="64" y="760" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">the top act 85 times in 100; a near miss otherwise</text><line x1="300" y1="784" x2="300" y2="820" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="820" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="844" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">DIVERSITY NUDGE</text><text x="64" y="868" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">the next pick leans away from this one's category</text><line x1="300" y1="892" x2="300" y2="928" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="928" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="952" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">CACHE AND LOG</text><text x="64" y="976" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">one answer per person per day; the score sheet kept</text></svg>