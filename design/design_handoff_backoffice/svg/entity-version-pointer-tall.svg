<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 772" width="600" height="772" role="img" aria-label="The entity, version, pointer model, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="772" fill="#1A2520"></rect><rect x="48" y="48" width="504" height="88" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="72" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">ENTITY</text><text x="64" y="96" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">one prompt, one grounding, one reading; it holds the</text><text x="64" y="112" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">pointer</text><line x1="300" y1="136" x2="300" y2="172" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="172" width="504" height="88" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="196" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">VERSIONS, APPEND-ONLY</text><text x="64" y="220" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">v1, v2 superseded; v3 published; v4 draft. Rows</text><text x="64" y="236" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">never change</text><line x1="300" y1="260" x2="300" y2="296" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="296" width="504" height="88" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="320" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">DRAFT</text><text x="64" y="344" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">edited in place; a revert is a new draft from any</text><text x="64" y="360" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">version</text><line x1="300" y1="384" x2="300" y2="420" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="420" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="444" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">IN REVIEW</text><text x="64" y="468" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">the diff against what is published</text><line x1="300" y1="492" x2="300" y2="528" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="528" width="504" height="88" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="64" y="552" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">IMPACT REVIEW</text><text x="64" y="576" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">when the edit fans out: every dependent, and what it</text><text x="64" y="592" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">will read</text><text x="536" y="552" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E" text-anchor="end">fan-out</text><line x1="300" y1="616" x2="300" y2="652" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="652" width="504" height="72" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="676" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">PUBLISHED</text><text x="64" y="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">the pointer moves here; nothing else moves</text></svg>