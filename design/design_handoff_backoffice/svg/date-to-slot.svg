<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="The date-to-slot pipeline: a date goes to the Sunday engine or the day engine, where precedence and transfers are settled; the Revised Common Lectionary anchor fixes the year and the week; a slot key names the day; a chain of tradition candidates is tried in order until one has readings." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="1200" height="460" fill="#1A2520"></rect><rect x="60" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="72" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">DATE</text><text x="72" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">any calendar day, in</text><text x="72" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the person's timezone</text><line x1="230" y1="175" x2="242" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="242" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="254" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">SUNDAY ENGINE</text><text x="254" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the season and the</text><text x="254" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">Sunday within it</text><line x1="412" y1="175" x2="424" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="424" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="436" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">DAY ENGINE</text><text x="436" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">feasts by precedence;</text><text x="436" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">transfers when two</text><text x="436" y="188" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">land together</text><line x1="594" y1="175" x2="606" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="606" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="618" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">RCL ANCHOR</text><text x="618" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">year A, B, or C; the</text><text x="618" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">proper number</text><line x1="776" y1="175" x2="788" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="788" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="800" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">SLOT KEY</text><text x="800" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">one string that names</text><text x="800" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the day for every</text><text x="800" y="188" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">tradition</text><line x1="958" y1="175" x2="970" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="970" y="110" width="170" height="130" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="982" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" letter-spacing="1">CANDIDATE CHAIN</text><text x="982" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">this tradition, its</text><text x="982" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">family, the RCL, the</text><text x="982" y="188" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">fallback</text><rect x="818" y="320" width="68" height="44" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="852" y="347" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" text-anchor="middle">tradition</text><line x1="886" y1="342" x2="894" y2="342" stroke="#4A5A50" stroke-width="1"></line><rect x="894" y="320" width="68" height="44" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="928" y="347" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90" text-anchor="middle">family</text><line x1="962" y1="342" x2="970" y2="342" stroke="#4A5A50" stroke-width="1"></line><rect x="970" y="320" width="68" height="44" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="1004" y="347" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90" text-anchor="middle">RCL</text><line x1="1038" y1="342" x2="1046" y2="342" stroke="#4A5A50" stroke-width="1"></line><rect x="1046" y="320" width="68" height="44" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="1080" y="347" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90" text-anchor="middle">fallback</text><text x="818" y="308" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">tried in order; the first with readings wins</text><path d="M1055 240 L1055 292" fill="none" stroke="#E0AE62" stroke-width="1"></path><text x="242" y="320" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">PRECEDENCE</text><text x="242" y="342" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">a feast outranks the Sunday or it does not; a feast</text><text x="242" y="357" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">on a Sunday it cannot outrank moves to the next</text><text x="242" y="372" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">free day: a transfer. Both engines agree on the key.</text><text x="60" y="86" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">9,002 pinned assertions hold every date on this path</text></svg>