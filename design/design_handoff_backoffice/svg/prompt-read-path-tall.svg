<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 832" width="600" height="832" role="img" aria-label="The prompt read path, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="832" fill="#1A2520"></rect><rect x="48" y="48" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="72" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">CALL SITE</text><text x="64" y="96" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">one of eleven AI surfaces asks for its prompt</text><line x1="300" y1="120" x2="300" y2="156" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="156" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="180" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">RESOLVER</text><text x="64" y="204" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">by surface key and the person's tradition</text><line x1="300" y1="228" x2="300" y2="264" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="264" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="288" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">CACHE · 60 S</text><text x="64" y="312" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">a hit answers here; a miss goes cold</text><text x="536" y="288" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E" text-anchor="end">60 s</text><line x1="300" y1="336" x2="300" y2="372" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="372" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="396" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">COLD READ</text><text x="64" y="420" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">one query, under a time budget</text><text x="536" y="396" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E" text-anchor="end">cold-read budget</text><line x1="300" y1="444" x2="300" y2="480" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="480" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="504" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">ASSEMBLY</text><text x="64" y="528" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">identity, grounding, teaching text, in order</text><line x1="300" y1="552" x2="300" y2="588" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="588" width="504" height="88" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="64" y="612" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">IN-CODE PRODUCER</text><text x="64" y="636" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">nine reasons send the call here; the prompt as</text><text x="64" y="652" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">shipped code, snapshot-tested</text><line x1="300" y1="676" x2="300" y2="712" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><rect x="48" y="712" width="504" height="72" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="736" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">LEDGER STAMP</text><text x="64" y="760" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">version served, source, reason, latency</text></svg>