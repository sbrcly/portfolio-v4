<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="The selection funnel: about four hundred acts pass eligibility, split into two pools, lose what was offered recently, pass the hard gates, take a weighted score and its penalties, and one is picked, the best eighty-five times in a hundred and a near miss otherwise; a diversity nudge steers the next pick, and the result is cached and logged." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="1200" height="460" fill="#1A2520"></rect><rect x="60" y="36" width="560" height="46" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="72" y="56" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">ELIGIBILITY</text><text x="72" y="71" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">about 400 acts; approved, in season, for this life context</text><line x1="340" y1="82" x2="340" y2="90" stroke="#4A5A50" stroke-width="1"></line><rect x="90" y="90" width="500" height="46" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="102" y="110" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">POOL SPLIT</text><text x="102" y="125" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">two pools: the person's own acts and the library's</text><line x1="340" y1="136" x2="340" y2="144" stroke="#4A5A50" stroke-width="1"></line><rect x="120" y="144" width="440" height="46" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="132" y="164" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">RECENCY EXCLUSION</text><text x="132" y="179" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">what was offered lately is out</text><line x1="340" y1="190" x2="340" y2="198" stroke="#4A5A50" stroke-width="1"></line><rect x="150" y="198" width="380" height="46" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="162" y="218" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">HARD GATES</text><text x="162" y="233" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">difficulty, time of day, what the person said no to</text><line x1="340" y1="244" x2="340" y2="252" stroke="#4A5A50" stroke-width="1"></line><rect x="180" y="252" width="320" height="46" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="192" y="272" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">WEIGHTED SCORE</text><text x="192" y="287" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">fit to focus area, personality, season</text><line x1="340" y1="298" x2="340" y2="306" stroke="#4A5A50" stroke-width="1"></line><rect x="210" y="306" width="260" height="46" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="222" y="326" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">PENALTIES</text><text x="222" y="341" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">repetition; the same category twice</text><line x1="340" y1="352" x2="340" y2="360" stroke="#4A5A50" stroke-width="1"></line><rect x="190" y="360" width="300" height="46" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="202" y="380" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" letter-spacing="1">85 / 15 PICK</text><text x="202" y="395" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the top act 85 in 100; a near miss otherwise</text><rect x="680" y="340" width="220" height="80" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="692" y="364" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">DIVERSITY NUDGE</text><text x="692" y="388" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the next pick leans away</text><text x="692" y="403" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">from this one's category</text><rect x="940" y="340" width="220" height="80" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="952" y="364" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">CACHE AND LOG</text><text x="952" y="388" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">one answer per person</text><text x="952" y="403" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">per day; the score sheet kept</text><path d="M490 383 L680 380" fill="none" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></path><line x1="900" y1="380" x2="940" y2="380" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><path d="M790 340 C 790 220 640 160 622 59" fill="none" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)" stroke-dasharray="3 3"></path><text x="800" y="300" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">steers the next run</text><text x="760" y="60" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">THE FUNNEL</text><text x="760" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">each stage removes; none adds.</text><text x="760" y="99" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the simulator runs this with a built person</text><text x="760" y="114" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">and shows the score sheet, so tuning takes</text><text x="760" y="129" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">an afternoon instead of a release.</text></svg>