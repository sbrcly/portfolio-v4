<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="The prompt read path: a call site asks the resolver; a sixty-second cache answers or a cold read runs within its budget; the prompt is assembled from its parts; any of nine reasons sends the call to the in-code producer instead; either way the ledger is stamped with what was served and why." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="1200" height="460" fill="#1A2520"></rect><rect x="60" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="72" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">CALL SITE</text><text x="72" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">one of eleven AI</text><text x="72" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">surfaces asks for its</text><text x="72" y="188" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">prompt</text><line x1="230" y1="175" x2="242" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="242" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="254" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">RESOLVER</text><text x="254" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">by surface key and the</text><text x="254" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">person's tradition</text><line x1="412" y1="175" x2="424" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="424" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="436" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">CACHE · 60 S</text><text x="436" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">a hit answers here; a</text><text x="436" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">miss goes cold</text><line x1="594" y1="175" x2="606" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="606" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="618" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">COLD READ</text><text x="618" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">one query, under a</text><text x="618" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">time budget</text><line x1="776" y1="175" x2="788" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="788" y="110" width="170" height="130" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="800" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">ASSEMBLY</text><text x="800" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">identity, grounding,</text><text x="800" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">teaching text, in</text><text x="800" y="188" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">order</text><line x1="958" y1="175" x2="970" y2="175" stroke="#4A5A50" stroke-width="1"></line><rect x="970" y="110" width="170" height="130" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="982" y="134" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E0AE62" letter-spacing="1">LEDGER STAMP</text><text x="982" y="158" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">version served,</text><text x="982" y="173" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">source, reason,</text><text x="982" y="188" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">latency</text><rect x="606" y="310" width="352" height="96" fill="#0E1512" stroke="#2E3B34" stroke-width="1" stroke-dasharray="3 3"></rect><text x="618" y="334" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">IN-CODE PRODUCER</text><text x="618" y="358" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">the fallback: the same prompt as shipped code,</text><text x="618" y="373" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">snapshot-tested against the published version</text><path d="M691 240 L691 310" fill="none" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)" stroke-dasharray="3 3"></path><path d="M873 240 L873 310" fill="none" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)" stroke-dasharray="3 3"></path><path d="M958 358 L1055 358 L1055 240" fill="none" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></path><text x="60" y="322" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#E4DBCB" letter-spacing="1">NINE REASONS TO FALL BACK</text><line x1="60" y1="340" x2="60" y2="356" stroke="#4A5A50" stroke-width="1"></line><line x1="82" y1="340" x2="82" y2="356" stroke="#4A5A50" stroke-width="1"></line><line x1="104" y1="340" x2="104" y2="356" stroke="#4A5A50" stroke-width="1"></line><line x1="126" y1="340" x2="126" y2="356" stroke="#4A5A50" stroke-width="1"></line><line x1="148" y1="340" x2="148" y2="356" stroke="#4A5A50" stroke-width="1"></line><line x1="170" y1="340" x2="170" y2="356" stroke="#4A5A50" stroke-width="1"></line><line x1="192" y1="340" x2="192" y2="356" stroke="#4A5A50" stroke-width="1"></line><line x1="214" y1="340" x2="214" y2="356" stroke="#4A5A50" stroke-width="1"></line><line x1="236" y1="340" x2="236" y2="356" stroke="#4A5A50" stroke-width="1"></line><text x="60" y="378" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">each one named on the ledger row;</text><text x="60" y="393" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#A89F90">a fallback is a fact, not a guess</text><text x="60" y="86" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">the read path</text><text x="606" y="298" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E">the fallback</text></svg>