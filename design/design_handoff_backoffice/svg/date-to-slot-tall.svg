<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 724" width="600" height="724" role="img" aria-label="The date-to-slot pipeline, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="724" fill="#1A2520"></rect><rect x="48" y="48" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="72" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">DATE</text><text x="64" y="96" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">any calendar day, in the person's timezone</text><line x1="300" y1="120" x2="300" y2="156" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="156" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="180" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">SUNDAY ENGINE</text><text x="64" y="204" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">the season and the Sunday within it</text><line x1="300" y1="228" x2="300" y2="264" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="264" width="504" height="88" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="288" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">DAY ENGINE</text><text x="64" y="312" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">feasts by precedence; transfers when two land</text><text x="64" y="328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">together</text><text x="536" y="288" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E" text-anchor="end">precedence · transfers</text><line x1="300" y1="352" x2="300" y2="388" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="388" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="412" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">RCL ANCHOR</text><text x="64" y="436" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">year A, B, or C; the proper number</text><line x1="300" y1="460" x2="300" y2="496" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="496" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="520" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">SLOT KEY</text><text x="64" y="544" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">one string that names the day for every tradition</text><line x1="300" y1="568" x2="300" y2="604" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="604" width="504" height="72" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="628" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">CANDIDATE CHAIN</text><text x="64" y="652" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">this tradition, its family, the RCL, the fallback</text><text x="536" y="628" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E" text-anchor="end">first with readings wins</text></svg>