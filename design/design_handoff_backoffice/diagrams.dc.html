<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Vigil r8 · Back office diagrams</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>html,body{margin:0;background:#0E1512;color:#E4DBCB;} a{color:#E4DBCB;} a:hover{color:#E0AE62;} img{display:block;max-width:100%;height:auto;}</style>
</helmet>
<div data-screen-label="Diagrams" style="display:flex;flex-direction:column;gap:48px;max-width:1200px;margin:0 auto;padding:48px 24px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#A89F90;">
  <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start;"><div><p style="margin:0 0 8px;">prompt-read-path</p><img src="svg/prompt-read-path.svg" alt=""></div><img src="svg/prompt-read-path-tall.svg" alt=""></div>
  <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start;"><div><p style="margin:0 0 8px;">entity-version-pointer</p><img src="svg/entity-version-pointer.svg" alt=""></div><img src="svg/entity-version-pointer-tall.svg" alt=""></div>
  <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start;"><div><p style="margin:0 0 8px;">date-to-slot</p><img src="svg/date-to-slot.svg" alt=""></div><img src="svg/date-to-slot-tall.svg" alt=""></div>
  <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start;"><div><p style="margin:0 0 8px;">readiness-horizon</p><img src="svg/readiness-horizon.svg" alt=""></div><img src="svg/readiness-horizon-tall.svg" alt=""></div>
  <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start;"><div><p style="margin:0 0 8px;">presence-union</p><img src="svg/presence-union.svg" alt=""></div><img src="svg/presence-union-tall.svg" alt=""></div>
  <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start;"><div><p style="margin:0 0 8px;">selection-funnel</p><img src="svg/selection-funnel.svg" alt=""></div><img src="svg/selection-funnel-tall.svg" alt=""></div>
</div>
</x-dc>
</body>
</html>
