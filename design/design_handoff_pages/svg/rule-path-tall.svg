<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="The rule's path, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="900" fill="#1A2520"></rect><line x1="72" y1="60" x2="72" y2="840" stroke="#E0AE62" stroke-width="1.5"></line><circle cx="72" cy="60" r="5" fill="#1A2520" stroke="#E0AE62" stroke-width="1.5"></circle><text x="100" y="50" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4DBCB">01  Map appears</text><text x="100" y="70" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" letter-spacing="1">ISOLATED WORLD</text><text x="100" y="90" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#A89F90">A MutationObserver waits for the section layer, then disconnects.</text><circle cx="72" cy="190" r="5" fill="#1A2520" stroke="#E0AE62" stroke-width="1.5"></circle><text x="100" y="180" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4DBCB">02  Content script asks</text><text x="100" y="200" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" letter-spacing="1">ISOLATED WORLD</text><text x="100" y="220" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#A89F90">One message to the worker with the event ID.</text><circle cx="72" cy="320" r="5" fill="#1A2520" stroke="#E0AE62" stroke-width="1.5"></circle><text x="100" y="310" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4DBCB">03  Worker fetches</text><text x="100" y="330" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" letter-spacing="1">EXTENSION</text><text x="100" y="350" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#A89F90">With the token borrowed from the open portal tab.</text><circle cx="72" cy="450" r="5" fill="#1A2520" stroke="#E0AE62" stroke-width="1.5"></circle><text x="100" y="440" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4DBCB">04  Poll while visible</text><text x="100" y="460" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" letter-spacing="1">ISOLATED WORLD</text><text x="100" y="480" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#A89F90">Every 15 seconds; paused when the tab is hidden.</text><circle cx="72" cy="580" r="5" fill="#1A2520" stroke="#E0AE62" stroke-width="1.5"></circle><text x="100" y="570" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4DBCB">05  Handoff</text><text x="100" y="590" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" letter-spacing="1">PAGE WORLD</text><text x="100" y="610" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#A89F90">Rules posted across the world boundary.</text><circle cx="72" cy="710" r="5" fill="#1A2520" stroke="#E0AE62" stroke-width="1.5"></circle><text x="100" y="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4DBCB">06  Seat IDs read</text><text x="100" y="720" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" letter-spacing="1">PAGE WORLD</text><text x="100" y="740" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#A89F90">From the React internals on each seat element.</text><circle cx="72" cy="840" r="5" fill="#1A2520" stroke="#E0AE62" stroke-width="1.5"></circle><text x="100" y="830" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4DBCB">07  Paint</text><text x="100" y="850" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A5A50" letter-spacing="1">PAGE WORLD</text><text x="100" y="870" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#A89F90">Rings, section fill, notes; cleared and reapplied each pass.</text></svg>