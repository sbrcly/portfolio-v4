<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Five origins: the portal page, the extension worker, the marketplace isolated world, the marketplace page world, and the identity iframe, with the rule travelling from the worker through the isolated world into the page world." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="1200" height="560" fill="#1A2520"></rect><rect x="48" y="72" width="208" height="280" fill="#0E1512" stroke="#4A5A50" stroke-width="1" stroke-dasharray="4 4"></rect><text x="64" y="102" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">PORTAL PAGE</text><text x="64" y="142" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">portal origin</text><text x="64" y="176" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Session token in page</text><text x="64" y="193" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">storage.</text><text x="64" y="222" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Reloaded to refresh the</text><text x="64" y="239" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">token.</text><rect x="284" y="72" width="208" height="280" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="300" y="102" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.3">EXTENSION WORKER</text><text x="300" y="142" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">extension origin</text><text x="300" y="176" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Routes every message.</text><text x="300" y="205" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Borrows the token and</text><text x="300" y="222" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">fetches the rules.</text><text x="300" y="251" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Badge: green or red.</text><rect x="520" y="72" width="208" height="280" fill="#0E1512" stroke="#4A5A50" stroke-width="1" stroke-dasharray="4 4"></rect><text x="536" y="102" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">MARKETPLACE · ISOLATED</text><text x="536" y="118" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">WORLD</text><text x="536" y="142" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">marketplace origin</text><text x="536" y="176" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Waits for the map; polls</text><text x="536" y="193" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">every 15 s while</text><text x="536" y="210" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">visible.</text><text x="536" y="239" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Compares, then hands the</text><text x="536" y="256" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">rules on.</text><rect x="756" y="72" width="208" height="280" fill="#0E1512" stroke="#4A5A50" stroke-width="1" stroke-dasharray="4 4"></rect><text x="772" y="102" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">MARKETPLACE · PAGE WORLD</text><text x="772" y="142" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">marketplace origin</text><text x="772" y="176" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Reads seat IDs from</text><text x="772" y="193" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">React internals.</text><text x="772" y="222" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Paints rings, fills,</text><text x="772" y="239" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">notes, the stop sign.</text><rect x="992" y="72" width="208" height="280" fill="#0E1512" stroke="#4A5A50" stroke-width="1" stroke-dasharray="4 4"></rect><text x="1008" y="102" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">IDENTITY IFRAME</text><text x="1008" y="142" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">identity origin</text><text x="1008" y="176" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Watches the verification</text><text x="1008" y="193" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">screen.</text><text x="1008" y="222" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Reports to the parent by</text><text x="1008" y="239" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">message.</text><line x1="388" y1="408" x2="192" y2="408" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="290" y="398" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50" text-anchor="middle">reads the token</text><line x1="624" y1="448" x2="418" y2="448" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="521" y="438" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50" text-anchor="middle">asks for the event's rules</text><line x1="388" y1="488" x2="594" y2="488" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="491" y="478" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" text-anchor="middle">rules, one-shot reply</text><line x1="624" y1="488" x2="830" y2="488" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="727" y="478" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" text-anchor="middle">window.postMessage</text><line x1="1096" y1="448" x2="890" y2="448" stroke="#4A5A50" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"></line><text x="993" y="438" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50" text-anchor="middle">origin-checked message</text><text x="48" y="532" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">Brass: the rule. Grey: what has to happen for the rule to move. Dashed boxes are origins the extension does not own.</text></svg>