<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1130" width="600" height="1130" role="img" aria-label="Five origins, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="1130" fill="#1A2520"></rect><rect x="48" y="48" width="504" height="140" fill="#0E1512" stroke="#4A5A50" stroke-width="1" stroke-dasharray="4 4"></rect><text x="64" y="78" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">PORTAL PAGE</text><text x="64" y="98" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">portal origin</text><text x="64" y="130" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Session token in page storage.</text><text x="64" y="150" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Reloaded to refresh the token.</text><line x1="300" y1="188" x2="300" y2="258" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><text x="314" y="228" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">the worker reads the token</text><rect x="48" y="258" width="504" height="140" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="288" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.3">EXTENSION WORKER</text><text x="64" y="308" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">extension origin</text><text x="64" y="340" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Routes every message.</text><text x="64" y="360" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Borrows the token and fetches the rules.</text><text x="64" y="380" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Badge: green or red.</text><line x1="300" y1="398" x2="300" y2="468" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="314" y="438" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62">rules, one-shot reply</text><rect x="48" y="468" width="504" height="140" fill="#0E1512" stroke="#4A5A50" stroke-width="1" stroke-dasharray="4 4"></rect><text x="64" y="498" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">MARKETPLACE · ISOLATED WORLD</text><text x="64" y="518" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">marketplace origin</text><text x="64" y="550" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Waits for the map; polls every 15 s while visible.</text><text x="64" y="570" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Compares, then hands the rules on.</text><line x1="300" y1="608" x2="300" y2="678" stroke="#E0AE62" stroke-width="1" marker-end="url(#ab)"></line><text x="314" y="648" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62">window.postMessage</text><rect x="48" y="678" width="504" height="140" fill="#0E1512" stroke="#4A5A50" stroke-width="1" stroke-dasharray="4 4"></rect><text x="64" y="708" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">MARKETPLACE · PAGE WORLD</text><text x="64" y="728" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">marketplace origin</text><text x="64" y="760" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Reads seat IDs from React internals.</text><text x="64" y="780" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Paints rings, fills, notes, the stop sign.</text><line x1="300" y1="818" x2="300" y2="888" stroke="#4A5A50" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"></line><text x="314" y="858" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">origin-checked message</text><rect x="48" y="888" width="504" height="140" fill="#0E1512" stroke="#4A5A50" stroke-width="1" stroke-dasharray="4 4"></rect><text x="64" y="918" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">IDENTITY IFRAME</text><text x="64" y="938" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">identity origin</text><text x="64" y="970" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Watches the verification screen.</text><text x="64" y="990" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">Reports to the parent by message.</text></svg>