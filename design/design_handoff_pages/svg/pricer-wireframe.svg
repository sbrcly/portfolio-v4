<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="The Pricer as a wireframe: four panels, market history and sales, the venue map, own listings, and marketplace listings, with the filter links drawn between them and the price-drop guard under them." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="1200" height="700" fill="#1A2520"></rect><rect x="48" y="72" width="540" height="250" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="98" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">MARKET HISTORY AND SALES</text><text x="64" y="118" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">Charts of the market over time; a sales table under them.</text><rect x="612" y="72" width="540" height="250" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="628" y="98" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">VENUE MAP</text><text x="628" y="118" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">Every section, coloured by the company's position.</text><rect x="48" y="400" width="540" height="220" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="426" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">OWN LISTINGS</text><text x="64" y="446" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">The company's inventory for the event; prices edited in place.</text><rect x="612" y="400" width="540" height="220" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="628" y="426" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.3">MARKETPLACE LISTINGS</text><text x="628" y="446" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">Current listings beside the company's, matched by section and row.</text><line x1="64" y1="300" x2="572" y2="300" stroke="#2E3B34" stroke-width="1"></line><line x1="64" y1="264" x2="572" y2="264" stroke="#2E3B34" stroke-width="1"></line><line x1="64" y1="228" x2="572" y2="228" stroke="#2E3B34" stroke-width="1"></line><line x1="64" y1="192" x2="572" y2="192" stroke="#2E3B34" stroke-width="1"></line><line x1="64" y1="156" x2="572" y2="156" stroke="#2E3B34" stroke-width="1"></line><path d="M64 290 C 160 270, 220 220, 300 200 S 460 130, 572 120" fill="none" stroke="#4A5A50" stroke-width="1"></path><rect x="640" y="130" width="60" height="30" fill="#1A2520" stroke="#2E3B34" stroke-width="1" opacity="1"></rect><rect x="712" y="130" width="60" height="30" fill="#1A2520" stroke="#2E3B34" stroke-width="1" opacity="1"></rect><rect x="784" y="130" width="60" height="30" fill="#1A2520" stroke="#2E3B34" stroke-width="1" opacity="1"></rect><rect x="856" y="130" width="60" height="30" fill="#1A2520" stroke="#2E3B34" stroke-width="1" opacity="1"></rect><rect x="928" y="130" width="60" height="30" fill="#1A2520" stroke="#2E3B34" stroke-width="1" opacity="1"></rect><rect x="1000" y="130" width="60" height="30" fill="#1A2520" stroke="#2E3B34" stroke-width="1" opacity="1"></rect><rect x="1072" y="130" width="60" height="30" fill="#1A2520" stroke="#2E3B34" stroke-width="1" opacity="1"></rect><rect x="640" y="