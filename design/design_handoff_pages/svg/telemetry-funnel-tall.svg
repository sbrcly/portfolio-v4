<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 980" width="600" height="980" role="img" aria-label="The telemetry funnel, stacked for the phone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker></defs><rect width="600" height="980" fill="#1A2520"></rect><rect x="48" y="48" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="74" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">BUYER'S PAGE</text><text x="64" y="98" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">a cart, an error, a confirmation</text><line x1="300" y1="120" x2="300" y2="156" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="156" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="182" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">CONTENT SCRIPT</text><text x="64" y="206" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">notices it; stamps the browser's time</text><text x="536" y="182" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E" text-anchor="end">t1 · browser clock</text><line x1="300" y1="228" x2="300" y2="264" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="264" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="290" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">EXTENSION WORKER</text><text x="64" y="314" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">one record, two destinations</text><line x1="300" y1="336" x2="300" y2="372" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="372" width="504" height="72" fill="#0E1512" stroke="#2E3B34" stroke-width="1"></rect><text x="64" y="398" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E4DBCB" letter-spacing="1.2">INGESTION ENDPOINT</text><text x="64" y="422" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">stamps the upload time; writes one document</text><text x="536" y="398" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F3C77E" text-anchor="end">t2 · server clock</text><line x1="300" y1="444" x2="300" y2="480" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="480" width="504" height="72" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="506" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">FIRESTORE</text><text x="64" y="530" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">pushes it to every listener</text><line x1="300" y1="552" x2="300" y2="588" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="588" width="504" height="72" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="614" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">LISTENER</text><text x="64" y="638" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">one tab, one collection, newest first</text><line x1="300" y1="660" x2="300" y2="696" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="696" width="504" height="72" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="722" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">REDUCE</text><text x="64" y="746" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">latest per buyer, account, event</text><line x1="300" y1="768" x2="300" y2="804" stroke="#4A5A50" stroke-width="1" marker-end="url(#a)"></line><rect x="48" y="804" width="504" height="72" fill="#0E1512" stroke="#E0AE62" stroke-width="1"></rect><text x="64" y="830" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E0AE62" letter-spacing="1.2">TABLE</text><text x="64" y="854" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A89F90">a row appears; roll-ups recomputed</text><text x="48" y="940" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A5A50">The worker also sends every record to the warehouse.</text></svg>