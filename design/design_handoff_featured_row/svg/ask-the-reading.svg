<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Ask the reading, a grounded question surface for Prava: a question asked after the reading, the passage retrieved for it with its source, and an answer that cites that passage and nothing else." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#E0AE62" stroke-width="1"></path></marker><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L7 4 L0 7.5" fill="none" stroke="#4A5A50" stroke-width="1"></path></marker></defs><rect width="1200" height="750" fill="#1A2520"></rect><text x="60" y="70" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="22" fill="#A89F90" letter-spacing="3">PRAVA · ASK THE READING</text><text x="1140" y="70" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="22" fill="#4A5A50" text-anchor="end" letter-spacing="3">SYNTHETIC</text><rect x="60" y="110" width="1080" height="170" fill="#0E1512" stroke="#2E3B34" stroke-width="1.5"></rect><text x="88" y="150" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#E4DBCB" letter-spacing="3">QUESTION</text><text x="88" y="222" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="44" fill="#E4DBCB">Why is Isaiah read beside this</text><text x="88" y="268" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="44" fill="#E4DBCB">Sunday’s Gospel?</text><line x1="600" y1="280" x2="600" y2="330" stroke="#4A5A50" stroke-width="1.5" marker-end="url(#a)"></line><rect x="60" y="330" width="520" height="330" fill="#0E1512" stroke="#2E3B34" stroke-width="1.5"></rect><text x="88" y="370" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#E4DBCB" letter-spacing="3">RETRIEVED</text><text x="552" y="370" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="22" fill="#E0AE62" text-anchor="end">[1]</text><text x="88" y="420" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">The people that walked in</text><text x="88" y="452" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">darkness have seen a great</text><text x="88" y="484" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">light: they that dwell in the</text><text x="88" y="516" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">land of the shadow of death,</text><text x="88" y="548" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">upon them hath the light</text><text x="88" y="580" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">shined.</text><text x="88" y="636" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#E4DBCB">Isaiah 9:2 · the first reading</text><rect x="620" y="330" width="520" height="330" fill="#0E1512" stroke="#E0AE62" stroke-width="1.5"></rect><text x="648" y="370" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#E0AE62" letter-spacing="3">ANSWER</text><text x="648" y="420" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">Because the Gospel announces</text><text x="648" y="452" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">the light Isaiah promised <tspan fill="#E0AE62">[1]</tspan></text><text x="648" y="484" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">the lectionary sets the promise</text><text x="648" y="516" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">beside its arrival. Said from</text><text x="648" y="548" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="24" fill="#A89F90">the passage, and nothing else.</text><text x="648" y="636" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#E0AE62">[1] Isaiah 9:2</text><line x1="620" y1="470" x2="582" y2="470" stroke="#E0AE62" stroke-width="1.5" marker-end="url(#ab)"></line><text x="60" y="712" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="18" fill="#4A5A50">Every answer cites the passage it was given. A question with no passage gets the reading, not an answer.</text></svg>